<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2345">
<meta name="description" content="Orange Crush Lacrosse parent hub — practices, games, field maps and directions.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orange Crush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta property="og:title" content="Orange Crush Lacrosse · Spring 2027">
<meta property="og:description" content="Practices, games, field maps and directions for Orange Crush families.">
<meta property="og:image" content="img/og.png">
<title>Orange Crush Lacrosse · Spring 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2345;--navy2:#16305C;--navy3:#22406f;--orange:#F15A29;--orange2:#d94a1c;--green:#4AB848;
  --bg:#F2F4F8;--card:#fff;--ink:#0E2345;--muted:#5B6B85;--line:#E3E8F0;
  --on:#16A34A;--cancel:#DC2626;--moved:#D97706;
  --boys:#2563EB;--girls:#DB2777;--prek:#3FA63D;
  --r:18px;--shadow:0 1px 2px rgba(14,35,69,.06),0 6px 20px rgba(14,35,69,.08);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safe-b))}
.h{font-family:Oswald,Inter,sans-serif;font-weight:700;letter-spacing:.005em}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top-row{display:flex;align-items:center;gap:12px}
.sharebtn{margin-left:auto;flex:none;display:grid;place-items:center;width:42px;height:42px;color:#fff;border-radius:12px;background:rgba(255,255,255,.12)}
.sharebtn span{display:none}
.top-row>div{min-width:0}
.top-title,.top-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.top.has-back .top-sub{display:none}.top.has-back .top-logo{width:38px;height:38px}}
.sharebtn svg{width:20px;height:20px}
.sharecard .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sharecard button{flex:1;min-width:150px;height:48px;border-radius:12px;font-weight:800;background:#EEF2F8;color:var(--navy)}
.sharecard button.primary{background:var(--orange);color:#fff}
.back{flex:none;display:flex;align-items:center;gap:2px;height:40px;padding:0 12px 0 8px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:15px}
.back svg{width:20px;height:20px}
.hero{position:relative}
.hero-share{position:absolute;right:14px;top:calc(14px + var(--safe-t));display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 11px;border-radius:12px;background:rgba(14,35,69,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:15px;z-index:2}
.hero-share svg{width:19px;height:19px}
.hero-back{z-index:2;position:absolute;left:14px;top:calc(14px + var(--safe-t));display:flex;align-items:center;gap:2px;height:40px;padding:0 14px 0 8px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px}
.sheet-x{width:38px;height:38px;border-radius:50%;background:#EEF2F8;display:grid;place-items:center;flex:none;font-size:22px;line-height:1;color:var(--navy);font-weight:700}
.sheet-close{display:block;width:100%;height:50px;margin-top:14px;border-radius:14px;background:#EEF2F8;font-weight:800;color:var(--navy)}
.top-logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.top-title{font-family:Oswald,sans-serif;font-weight:700;font-size:22px;line-height:1.05;letter-spacing:.01em}
.top-sub{font-size:12px;color:#9fb0cc;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.top-sub b{color:var(--orange)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tags::-webkit-scrollbar{display:none}
.tag{box-shadow:inset 4px 0 0 var(--tc,transparent);flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 9px 9px 14px;min-height:44px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;font-size:14px;border:1.5px solid transparent}
.tag i{display:none}
.tag .x{width:30px;height:30px;margin:-4px -4px -4px 0;font-size:17px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:14px;line-height:1}
.tag.add{background:var(--orange);padding:7px 14px}
.tag.ghost{background:transparent;border-color:rgba(255,255,255,.25);padding:7px 14px;color:#cfd8e8}

.notice{margin:14px 16px 0;background:#FFF4E5;border:1.5px solid #F7C77E;color:#7a4a00;border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.notice svg{flex:none;margin-top:1px}

.sec{padding:0 16px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sec-h button{font-size:14px;font-weight:700;color:var(--orange)}

/* next up card */
.next{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;position:relative}
.next-band{--base:#0E2345;--tint:transparent;--ph:none;--phs:60% auto;background:linear-gradient(100deg,var(--base) 0%,var(--base) 36%,color-mix(in srgb,var(--base) 45%,transparent) 72%,color-mix(in srgb,var(--base) 10%,transparent) 100%),linear-gradient(var(--tint),var(--tint)),var(--ph) right center/var(--phs) no-repeat,var(--base);color:#fff;padding:16px 18px 18px;position:relative;overflow:hidden}
.next.tonight .next-band{--base:#E04E1E}

.next.tonight .next-rel{color:#D9441A}
.tonight-tag{display:inline-block;background:#fff;color:#D9441A;font-family:Oswald,sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;padding:4px 10px;border-radius:999px;margin-left:8px}
.next-band.p-boys{--ph:url(img/wm-boys.jpg);--tint:rgba(37,99,235,.38)}
.next-band.p-girls{--ph:url(img/wm-girls.jpg);--tint:rgba(219,39,119,.38)}
.next-band.p-prek{--ph:url(img/wm-prek.png);--phs:auto 150%}
.next.tonight .next-band.p-boys,.next.tonight .next-band.p-girls{--tint:rgba(241,90,41,.30)}
.next-band > *{position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.next-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.tteam{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.tteam i{display:none}
.badge{font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.badge.on{background:var(--on)}.badge.cancelled{background:var(--cancel)}.badge.moved{background:var(--moved)}.badge.done{background:#64748b}
.next-when{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px;position:relative;z-index:1}
.next-date{white-space:nowrap;font-family:Oswald,sans-serif;font-weight:700;font-size:36px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.next-rel{font-size:13px;font-weight:800;color:var(--orange);background:#fff;border-radius:999px;padding:5px 10px;white-space:nowrap}
.next-time{margin-top:8px;font-size:18px;font-weight:700;position:relative;z-index:1;color:#e3e9f3}
.next-body{padding:14px 18px 16px}
.row-i{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.row-i svg{flex:none;color:var(--orange);margin-top:2px}
.row-i .t1{font-weight:700}
.row-i .t2{color:var(--muted);font-size:14px}
.maplink{display:block;border-radius:10px}
.maplink .t1,.maplink b{text-decoration:underline;text-decoration-color:rgba(241,90,41,.45);text-underline-offset:3px}
.maphint{display:inline-block;margin-top:3px;font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.02em}
.zone{display:inline-block;margin-top:4px;background:#EEF2F8;border-radius:8px;padding:3px 8px;font-weight:800;font-size:13px;color:var(--navy)}
.note{margin-top:8px;background:#FFF7ED;border-left:4px solid var(--moved);padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#7c3d06}
.note.c{background:#FEF2F2;border-color:var(--cancel);color:#7f1d1d}
.next.cancelled .next-date,.next.cancelled .next-time{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.fallback{margin-top:10px;font-size:14px;font-weight:700;color:var(--navy)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border-radius:14px;background:#EEF2F8;font-weight:700;font-size:13px;color:var(--navy);text-align:center;padding:6px}
.btn.primary{background:var(--orange);color:#fff}
.btn:active{transform:scale(.97)}

/* lists */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.ev:first-child{border-top:0}
.ev:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--tc)}
.ev-date{width:48px;flex:none;text-align:center;line-height:1.05}
.ev-date .d1{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ev-date .d2{font-family:Oswald,sans-serif;font-size:24px;font-weight:700}
.ev-date .d3{font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase}
.ev-main{flex:1;min-width:0}
.ev-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-s{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.is-cancelled .ev-t,.ev.is-cancelled .ev-s{text-decoration:line-through;opacity:.6}
.ev.past{opacity:.55}
.type-ic{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:2px;background:#EEF2F8;color:var(--navy)}
.type-ic.game{background:var(--navy);color:#fff}.type-ic.event{background:#E8F6E7;color:#1f6b1d}
.day-h{padding:16px 4px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.day-h.today{color:var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;min-height:42px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{background:#fff;border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow);font-weight:600}
.tba{margin-top:10px;font-size:13px;color:var(--muted);font-weight:600;text-align:center}

/* picker */
.hero{background:linear-gradient(180deg,rgba(14,35,69,.30) 0%,rgba(14,35,69,.55) 45%,rgba(14,35,69,.92) 82%,#0E2345 100%),url(img/hero-group.jpg) center 45%/cover no-repeat,#0E2345;color:#fff;text-align:center;padding:calc(26px + var(--safe-t)) 20px 44px;border-radius:0 0 28px 28px}
.hero h1,.hero .k,.hero p{text-shadow:0 2px 12px rgba(0,0,0,.45)}
.hero img{width:100px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero .k{font-size:12px;letter-spacing:.2em;font-weight:800;color:var(--orange);margin-top:8px}
.hero h1{margin:6px 0 4px;font-family:Oswald,sans-serif;font-weight:700;font-size:38px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.hero p{margin:0;color:#b8c5dc;font-weight:600}
.welcome{margin:-18px 16px 0;position:relative;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 16px;border-top:4px solid var(--orange)}
.welcome h2{margin:0;font-size:20px;line-height:1.2}
.welcome p{margin:8px 0 0;color:#2b3b57;font-size:15px;line-height:1.5}
.welcome .wq{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.welcome .wq a{color:var(--orange);font-weight:800;word-break:break-word}
.pick-q{padding:22px 18px 0}
.pick-q h2{margin:0;font-size:22px}
.pick-q p{margin:6px 0 0;color:var(--muted);font-weight:500}
.grp{padding:16px 16px 0}
.grp-ban{height:68px;border-radius:16px;margin:0 0 10px;padding:0 18px;display:flex;align-items:center;color:#fff;font-family:Oswald,sans-serif;font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.3);box-shadow:var(--shadow);
  background:linear-gradient(90deg,var(--tc) 0%,var(--tc) 40%,color-mix(in srgb,var(--tc) 55%,transparent) 75%,color-mix(in srgb,var(--tc) 25%,transparent) 100%),var(--ph) right center/var(--phs,55% auto) no-repeat,#0E2345}
.grp-ban.p-boys{--ph:url(img/wm-boys.jpg);--phs:60% auto;background-position:0 0,right 30%}
.grp-ban.p-girls{--ph:url(img/wm-girls.jpg);--phs:60% auto;background-position:0 0,right 35%}
.grp-ban.p-prek{--ph:url(img/wm-prek.png);--phs:auto 170%;background:linear-gradient(90deg,var(--tc) 0%,var(--tc) 55%,color-mix(in srgb,var(--tc) 80%,transparent) 100%),url(img/wm-prek.png) right -10px center/auto 170% no-repeat,var(--tc)}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grp-h i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{position:relative;text-align:left;background:#fff;border-radius:16px;padding:14px 14px 13px;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .08s}
.tcard:active{transform:scale(.98)}
.tcard .n{font-family:Oswald,sans-serif;font-weight:700;font-size:24px;line-height:1.1}
.tcard .g{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.tcard .tm{font-size:13px;font-weight:700;margin-top:8px;color:var(--navy)}
.tcard .ck{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.tcard{border-top:5px solid var(--tc)}
.tcard .n{color:var(--tc)}
.tcard.sel{border-color:var(--tc);background:var(--tc);color:#fff}
.tcard.sel .n,.tcard.sel .g,.tcard.sel .tm{color:#fff}
.tcard.sel .ck{background:#fff;border-color:#fff;color:var(--tc)}
.tcard.wide{grid-column:1/-1}
.pick-go{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(12px + var(--safe-b));background:rgba(242,244,248,.97);box-shadow:0 -6px 18px rgba(14,35,69,.08);border-top:1px solid var(--line)}
.picked{max-width:568px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.picked.hint{justify-content:center}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--tc);color:#fff;font-weight:800;font-size:14px}
.pchip b{font-size:17px;line-height:1}
.pick-go button.go{display:block;width:100%;max-width:568px;margin:0 auto;height:56px;border-radius:16px;background:var(--orange);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 20px rgba(241,90,41,.35)}
.pick-go button.go:disabled{background:#c3cad6;box-shadow:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -4px 18px rgba(14,35,69,.06)}
.nav-in{max-width:600px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;min-height:56px;font-size:12px;font-weight:700;color:#8a97ad;letter-spacing:.02em}
.nav button.on{color:var(--orange)}

/* map */
.seg{display:flex;background:#E3E8F0;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mapimg{display:block;width:100%;border-radius:16px;box-shadow:var(--shadow);margin-top:12px;cursor:zoom-in}
.spot{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-top:10px}
.spot i{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.spot b{display:block}
.spot span{font-size:14px;color:var(--muted)}

/* info */
.icard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.icard h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.icard h3 svg{color:var(--orange)}
.icard p{margin:6px 0 0;color:#2b3b57}
.tbd{color:var(--muted);font-style:italic}
.ttable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ttable td{padding:8px 0;border-top:1px solid var(--line)}
.ttable tr:first-child td{border-top:0}
.ttable td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.ttable i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);margin-right:8px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:8px;padding:9px 14px;border-radius:12px;background:#EEF2F8;font-weight:700;font-size:14px}
.linkbtn.primary{background:var(--orange);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,18,38,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--safe-b));animation:up .2s ease-out}
.grab{width:44px;height:5px;border-radius:9px;background:#d5dbe5;margin:2px auto 12px}
.sheet h3{margin:0;font-size:22px}
.sheet .sub{color:var(--muted);font-weight:600;margin-top:2px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.viewer{position:fixed;inset:0;background:#081226;z-index:60;display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 12px 10px;color:#fff;font-weight:800}
.viewer-bar .zb{display:flex;gap:8px}
.viewer-bar button{min-width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:18px;padding:0 12px}
.viewer-sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer-sc img{display:block}

/* coach */

<script>
(function(){

const SB_URL = "https://wpmacnjuwbtzxqcmxrzq.supabase.co";

let DATA = {notice:"",overrides:{},custom:[]};

function fmtT(hm){ let [h,m]=hm.split(":").map(Number); return (h%12||12)+":"+pad(m); }
function ap(hm){ return Number(hm.split(":")[0])>=12?"PM":"AM"; }
function fmtRange(a,b){ if(!a) return "Time TBA"; if(!b) return fmtT(a)+" "+ap(a); return ap(a)===ap(b) ? fmtT(a)+" – "+fmtT(b)+" "+ap(b) : fmtT(a)+" "+ap(a)+" – "+fmtT(b)+" "+ap(b); }
const fmtDate = ds => { const d=parseD(ds); return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); };
const fmtDateL = ds => { const d=parseD(ds); return DOWL[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); };
function dayDiff(ds){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseD(ds)-t)/86400000); }
function rel(ds){ const n=dayDiff(ds); if(n===0) return "Today"; if(n===1) return "Tomorrow"; if(n<0) return n===-1?"Yesterday":(-n)+" days ago"; if(n<7) return "This "+DOWL[parseD(ds).getDay()]; return "In "+n+" days"; }
const dirURL = addr => "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(addr);
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const mapsURL = addr => IOS ? appleURL(addr) : dirURL(addr);
const otherMaps = addr => IOS ? ["Google Maps",dirURL(addr)] : ["Apple Maps",appleURL(addr)];
const appleURL = addr => "https://maps.apple.com/?daddr="+encodeURIComponent(addr);
function gcalURL(e){
  const f = (ds,hm)=>ds.replace(/-/g,"")+"T"+hm.replace(":","")+"00";
  const who = e.teams.map(teamLabel).join(", ");
  const title = "Orange Crush – "+who+" "+(e.type==="practice"?"Practice":e.title);
  let dates; if(e.start){ dates=f(e.date,e.start)+"/"+f(e.date,e.stop||e.start); } else { const n=parseD(e.date); n.setDate(n.getDate()+1); dates=e.date.replace(/-/g,"")+"/"+ymd(n).replace(/-/g,""); }
  const p = new URLSearchParams({action:"TEMPLATE",text:title,dates:dates,ctz:"America/Chicago",location:e.addr?(e.locName+", "+e.addr):"Location TBA",details:(e.zone?("Field: "+e.zone+"\n"):"")+(e.note||"")});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function dirBtn(e){ return e.locTBA ? '<span class="btn" style="opacity:.45">'+I.nav+'Location TBA</span>' : '<a class="btn primary" href="'+mapsURL(e.addr)+'" target="_blank" rel="noopener">'+I.nav+'Directions</a>'; }

}
function teamLabel(id){ if(id==="all") return "All teams"; if(PROGS[id]) return "All "+PROGS[id].label; return TEAM[id]?TEAM[id].name:id; }

/* ================= events ================= */
function genPractices(){
  const out=[];
  TEAMS.forEach(t=>{
    for(let d=parseD(CONFIG.seasonStart); d<=parseD(t.last); d.setDate(d.getDate()+1)){
      if(!(t.days||CONFIG.practiceDays).includes(d.getDay())) continue;
      const ds=ymd(d);
      out.push({id:"p-"+t.id+"-"+ds.replace(/-/g,""),type:"practice",teams:[t.id],date:ds,start:t.start,stop:t.stop,title:"Practice",loc:"nnhs",zone:t.zone,wave:t.wave});
    }
  });
  return out;
}

  const out=[];
  GAMES.forEach(g=>GAME_TEAMS.forEach(tid=>out.push({id:"g-"+g.key+"-"+tid,type:"game",teams:[tid],date:g.date,start:"",stop:"",title:g.title,locName:"",addr:"",zone:""})));
  return out;
}
const BASE = genPractices().concat(genGames());
const FIRST = {}; BASE.forEach(e=>{ if(e.type==="practice"){ const t=e.teams[0]; if(!FIRST[t]||e.date<FIRST[t]) FIRST[t]=e.date; } });
const dayTag = t => t.days ? "Tuesdays · " : "";
function allEvents(){
  const list = BASE.concat(DATA.custom.map(c=>Object.assign({},c)));
  return list.map(e=>{
    const o = DATA.overrides[e.id]||{};
    const L = LOCS[e.loc]||{};
    const ev = Object.assign({status:"on",note:""}, e, {locName:e.locName||L.name||"", addr:e.addr||L.addr||""});
    ev.tba = !e.start;
    if(o.status) ev.status=o.status;
    if(o.note!=null) ev.note=o.note;
    if(o.start) ev.start=o.start;
    if(o.stop) ev.stop=o.stop;
    if(o.locName){ ev.locName=o.locName; ev.zone=""; }
    if(o.addr) ev.addr=o.addr;
    if(o.zone!=null && o.zone!=="") ev.zone=o.zone;
    ev.when = at(ev.date,ev.start||"12:00"); ev.ends = ev.start ? at(ev.date,ev.stop||ev.start) : at(ev.date,"23:59");
    ev.locTBA = !ev.addr;
    return ev;
  }).sort((a,b)=>a.when-b.when || a.teams[0].localeCompare(b.teams[0]));
}
function forTeam(e,tid){ return e.teams.some(x=>x===tid||x==="all"||x===TEAM[tid].prog); }

/* ================= state ================= */
const S = { sel:[], view:"pick", filter:"all", past:false, wave:1, coach:false, returnTo:"home", stack:[], selSnap:null };
function goView(v){
  if(v===S.view && !ov.innerHTML) return;
  if(history.state && history.state.ov){ ov.innerHTML=""; S.view=v; try{ history.replaceState({v},""); }catch(e){} return; }
  S.view=v; try{ history.pushState({v},""); }catch(e){}
}
function openOv(html){ const had=!!ov.innerHTML; ov.innerHTML=html; if(!had){ try{ history.pushState({v:S.view,ov:1},""); }catch(e){} } }

function goBack(){ if(history.state && (history.state.v!=="home" || history.state.ov) && history.length>1){ history.back(); } else { S.view="home"; render(); } }
window.addEventListener("popstate",e=>{
  const st=e.state||{v:"home"};

  if(S.view==="pick" && st.v!=="pick"){ if(!S.keepSel && S.selSnap){ S.sel=S.selSnap.slice(); } S.keepSel=false; S.selSnap=null; writeHash(); }

  if(S.view!=="pick" && !S.sel.length) S.view="pick";
  if(S.view==="coach" && !S.coach) S.view="home";
  render(); window.scrollTo(0,0);
});
let PASS = null;
try{ PASS = sessionStorage.getItem("crush-pass"); if(PASS) S.coach=true; }catch(e){}

function readHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if(!h) return [];
  return h.split("-").filter(x=>TEAM[x]);
}
function writeHash(){ try{ if(location.hash) history.replaceState(history.state,"",location.pathname+location.search); }catch(e){} }
(function init(){

  // Every visitor starts on the welcome screen and picks their own teams (links never pre-select).
})();

const app = document.getElementById("app");
const ov = document.getElementById("overlay");
let logoTaps=[];

function render(){
  if(S.view==="pick"){ app.innerHTML = renderPick(); return; }
  let body="";
  if(S.view==="home") body=renderHome();
  else if(S.view==="schedule") body=renderSchedule();
  else if(S.view==="map") body=renderMap();
  else if(S.view==="info") body=renderInfo();
  else if(S.view==="coach") body=renderCoach();
  app.innerHTML = '<div class="wrap">'+renderTop()+notice()+body+'<div class="foot">Orange Crush Lacrosse · '+esc(CONFIG.season)+(CONFIG.website?' · <a href="'+esc(CONFIG.website.url)+'" target="_blank" rel="noopener" style="color:var(--orange)">Website</a>':'')+'</div></div>'+renderNav();
}

function renderTop(){
  const tags = S.sel.map(id=>'<span class="tag" style="--tc:'+tColor(id)+'"><i></i>'+esc(TEAM[id].short)+('<button class="x" data-act="rm" data-id="'+id+'" aria-label="Remove '+esc(TEAM[id].name)+'">×</button>')+'</span>').join("");
  return (S.coach?'<div class="coachbar"><span>COACH MODE · changes save instantly for every family</span><button data-act="coachoff">Exit</button></div>':'')+
  '<header class="top'+(S.view!=="home"?" has-back":"")+'"><div class="top-row">'+(S.view!=="home"?'<button class="back" data-act="back" aria-label="Back">'+I.back+'Back</button>':'')+'<img class="top-logo" src="'+A.logo+'" alt="Orange Crush" data-act="logo"><div><div class="top-title">'+({schedule:"SCHEDULE",map:"FIELD MAP",info:"INFO",coach:"COACH"}[S.view]||"ORANGE CRUSH")+'</div><div class="top-sub">'+esc(CONFIG.season)+' · <b>Parent Hub</b></div></div><button class="sharebtn" data-act="share" aria-label="Share this app">'+I.share+'<span>Share</span></button></div>'+
  '<div class="tags">'+tags+'<button class="tag add" data-act="add">+ Add a child</button><button class="tag ghost" data-act="switch">Switch team</button></div></header>';

function countdown(e){
  if(!e.start) return "Today";
  const now=new Date(), mins=Math.round((e.when-now)/60000);
  if(mins<=0) return now<e.ends ? "Happening now" : "Today";
  if(mins<60) return "Starts in "+mins+" min";
  const h=Math.floor(mins/60), m=mins%60;
  return "Starts in "+h+" hr"+(m?" "+m+" min":"");
}
function nextFor(tid,evs){
  const now=new Date();
  const up=evs.filter(e=>forTeam(e,tid) && e.ends>=now);
  return up;
}
function nextCard(tid,evs){
  const t=TEAM[tid], c=tColor(tid);
  const up=nextFor(tid,evs);
  if(!up.length){
    return '<div class="next" style="--tc:'+c+'"><div class="next-band"><div class="next-top"><span class="tteam"><i></i>'+esc(t.name)+'</span><span class="badge done">SEASON</span></div><div class="next-when"><div class="next-date">'+(t.prog==="girls"&&CONFIG.girlsEndTBA?"More dates coming":"Season complete")+'</div></div><div class="next-time">'+(t.prog==="girls"&&CONFIG.girlsEndTBA?"Season end date to be announced":"Thanks for a great season!")+'</div></div></div>';
  }
  const e=up[0];
  const fb = e.status==="cancelled" ? up.find(x=>x.status!=="cancelled") : null;
  const badge = e.status==="cancelled"?"CANCELLED":e.status==="moved"?"CHANGED":"ON";
  const today = dayDiff(e.date)===0 && e.status!=="cancelled";
  let pre = dayDiff(e.date)>0 && e.type==="practice" && e.date===FIRST[tid] ? "First practice" : rel(e.date);
  if(today) pre = countdown(e);
  const dayWord = e.start && Number(e.start.split(":")[0])>=17 ? "TONIGHT" : "TODAY";
  return '<div class="next '+(e.status==="cancelled"?"cancelled":"")+(today?" tonight":"")+'" style="--tc:'+c+'">'+
    '<div class="next-band p-'+t.prog+'"><div class="next-top"><span class="tteam"><i></i>'+esc(t.name)+(today?'<span class="tonight-tag">'+dayWord+'</span>':'')+'</span><span class="badge '+e.status+'">'+badge+'</span></div>'+
    '<div class="next-when"><div class="next-date">'+fmtDate(e.date)+'</div><div class="next-rel">'+esc(pre)+'</div></div>'+
    '<div class="next-time">'+fmtRange(e.start,e.stop)+' · '+(e.type==="practice"?"Practice":esc(e.title))+'</div></div>'+
    '<div class="next-body">'+
      locBlock(e)+
      (e.note?'<div class="note'+(e.status==="cancelled"?" c":"")+'">'+esc(e.note)+'</div>':'')+
      (fb?'<div class="fallback">Next session: '+fmtDate(fb.date)+' · '+fmtRange(fb.start,fb.stop)+'</div>':'')+
      '<div class="btns">'+dirBtn(e)+
      (e.type==="practice"&&e.loc==="nnhs"&&!DATA.overrides[e.id]?.locName?'<button class="btn" data-act="map" data-wave="'+e.wave+'">'+I.map+'Field map</button>':'<button class="btn" data-act="ev" data-id="'+esc(e.id)+'">'+I.info+'Details</button>')+
      '<a class="btn" href="'+gcalURL(e)+'" target="_blank" rel="noopener">'+I.calAdd+'Calendar</a></div>'+
    '</div></div>';
}

  return '<div class="form" style="border-top:1px solid var(--line);margin-top:18px;padding-top:6px"><label>Coach · status</label><select id="e-status"><option value="on"'+(e.status==="on"?" selected":"")+'>On</option><option value="cancelled"'+(e.status==="cancelled"?" selected":"")+'>Cancelled</option><option value="moved"'+(e.status==="moved"?" selected":"")+'>Changed</option></select>'+
  '<label>Note to families</label><input id="e-note" value="'+esc(o.note!=null?o.note:(custom?e.note:""))+'" placeholder="optional">'+
  '<div class="two"><div><label>Start</label><input type="time" id="e-start" value="'+esc(e.start)+'"></div><div><label>End</label><input type="time" id="e-stop" value="'+esc(e.stop||"")+'"></div></div>'+
  '<label>Field / spot</label><input id="e-zone" value="'+esc(e.zone||"")+'">'+
  '<label>'+(e.type==="game"?"Game location":"Move to another location (optional)")+'</label><input id="e-loc" value="'+esc(o.locName||"")+'" placeholder="Location name">'+
  '<input id="e-addr" style="margin-top:8px" value="'+esc(o.addr||"")+'" placeholder="Address">'+
  '<div class="act"><button class="primary" data-act="e-save" data-id="'+esc(e.id)+'">Save &amp; publish</button>'+(DATA.overrides[e.id]?'<button data-act="e-reset" data-id="'+esc(e.id)+'">Reset</button>':'')+(custom?'<button class="danger" data-act="e-del" data-id="'+esc(e.id)+'">Delete</button>':'')+'</div><div class="statusline" id="e-msg"></div></div>';
}
function openViewer(){
  const img=S.wave===1?A.map1:A.map2; let z=1;
  openOv('<div class="viewer"><div class="viewer-bar"><span>Wave '+S.wave+' · '+(S.wave===1?"6:00":"7:00")+' PM</span><div class="zb"><button data-act="zout">−</button><button data-act="zin">+</button><button data-act="x">'+I.back.replace('width="22" height="22"','width="18" height="18"')+' Back</button></div></div><div class="viewer-sc"><img id="vimg" src="'+img+'" alt="Field map"></div></div>');
  const im=document.getElementById("vimg");
  const fit=()=>{ im.style.width=(100*z)+"%"; };
  fit();
  ov.querySelector('[data-act="zin"]').onclick=e=>{e.stopPropagation(); z=Math.min(3,z+.5); fit();};
  ov.querySelector('[data-act="zout"]').onclick=e=>{e.stopPropagation(); z=Math.max(1,z-.5); fit();};
}

/* ---------- live data ---------- */
async function loadState(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/crush_state?id=eq.1&select=data,updated_at",{headers:{apikey:SB_KEY},cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    const before=JSON.stringify(DATA)+live.ok;
    if(j[0]){ setData(j[0].data); live.at=j[0].updated_at; }
    live.ok=true;
    if(before!==JSON.stringify(DATA)+live.ok && !typing()) render();
  }catch(e){ const was=live.ok; live.ok=false; if(was!==false && !typing()) render(); }
}
function typing(){ const a=document.activeElement; return S.view==="coach" && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
async function rpc(fn,args){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok){ const m=(j&&(j.message||j.hint))||t||String(r.status); const err=new Error(m); err.status=r.status; throw err; }
  return j;
}
async function save(next,msgEl){
  const say=t=>{ const el=document.getElementById(msgEl||"c-status"); if(el) el.textContent=t; toast(t); };
  if(!coachPass()){ say("Coach mode is locked. Tap the logo 5 times to unlock."); return false; }
  say("Saving…");
  try{
    const ts=await rpc("crush_save",{pass:coachPass(),new_data:next});
    setData(next); live.ok=true; live.at=ts||new Date().toISOString();
    if(ov.innerHTML) closeOv();
    render(); toast("Saved ✓ Live for every family");
    return true;
  }catch(err){
    if(/bad_passcode/.test(err.message)){ setPass(null); S.coach=false; say("Passcode not accepted. Coach mode locked."); if(ov.innerHTML) closeOv(); S.view="home"; render(); }
    else say("Save failed. Check your connection and try again.");
    return false;
  }
}
function openUnlock(){
  openOv('<div class="scrim" data-act="close"><div class="sheet form" data-stop><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="h">Coach mode</h3><button class="sheet-x" data-act="x" aria-label="Close">×</button></div><label>Passcode</label><input type="password" id="u-pass" autocomplete="current-password"><div class="act"><button class="primary" data-act="unlock">Unlock</button></div><div class="statusline" id="u-msg"></div></div></div>');
  setTimeout(()=>{ const i=document.getElementById("u-pass"); if(i) i.focus(); },50);
}
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;
function toast(t){ let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el);} el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const sheet=ev.target.closest("[data-stop]");
  const el=ev.target.closest("[data-act]");
  if(!el){ return; }
  if(sheet && el.dataset.act==="close" && !el.closest(".viewer")) { if(el===sheet.closest(".scrim")) {} }
  const act=el.dataset.act;
  if(act==="close"){ if(sheet && ev.target.closest(".sheet")) return; closeOv(); return; }
  switch(act){
    case "x": closeOv(); return;
    case "back": goBack(); return;
    case "logo":{
      const now=Date.now(); logoTaps=logoTaps.filter(t=>now-t<2500); logoTaps.push(now);
      if(logoTaps.length>=5){ logoTaps=[]; if(S.coach){ goView("coach"); render(); } else openUnlock(); }
      return;
    }
    case "unlock":{
      const p=document.getElementById("u-pass").value; const msg=document.getElementById("u-msg");
      if(!p){ return; } msg.textContent="Checking…";
      try{ const ok=await rpc("crush_check",{pass:p}); if(ok===true){ setPass(p); S.coach=true; toast("Coach mode unlocked"); goView("coach"); render(); } else msg.textContent="That passcode didn't work."; }
      catch(e){ msg.textContent="Couldn't reach the server. Check your connection."; }
      return;
    }
    case "c-pass":{
      const a=document.getElementById("p-new").value, b=document.getElementById("p-new2").value;
      if(a.length<8){ toast("Use at least 8 characters"); return; } if(a!==b){ toast("The two entries don't match"); return; }
      try{ await rpc("crush_set_passcode",{old_pass:coachPass(),new_pass:a}); setPass(a); toast("Passcode changed ✓"); document.getElementById("p-new").value=""; document.getElementById("p-new2").value=""; }
      catch(e){ toast("Couldn't change the passcode."); }
      return;
    }
    case "tog":{ const id=el.dataset.id; S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):S.sel.concat(id); S.sel=TEAMS.map(t=>t.id).filter(x=>S.sel.includes(x)); render(); return; }
    case "selall": S.sel=TEAMS.map(t=>t.id); render(); return;
    case "done": if(!S.sel.length) return; writeHash();
      if(S.selSnap && history.state && history.state.v==="pick"){ S.keepSel=true; history.back(); }
      else { S.selSnap=null; S.view="home"; try{ history.replaceState({v:"home"},""); }catch(e){} render(); window.scrollTo(0,0); }
      return;
    case "add": S.selSnap=S.sel.slice(); goView("pick"); render(); window.scrollTo(0,0); return;
    case "switch": S.selSnap=S.sel.slice(); S.sel=[]; goView("pick"); render(); window.scrollTo(0,0); return;
    case "rm": ev.stopPropagation(); S.sel=S.sel.filter(x=>x!==el.dataset.id); if(!S.sel.length){ S.selSnap=null; S.view="pick"; try{ history.replaceState({v:"pick"},""); }catch(e){} } render(); window.scrollTo(0,0); toast("Team removed"); return;
    case "go": goView(el.dataset.v); if(S.view==="map") S.wave=defaultWave(); render(); window.scrollTo(0,0); return;
    case "filter": S.filter=el.dataset.f; render(); return;
    case "share":{
      const base=location.origin+location.pathname;
      const team=el.dataset.team && S.sel.length;
      const url=team?base+"#"+S.sel.join("-"):base;
      const who=team?S.sel.map(id=>TEAM[id].name).join(" & ")+" schedule":"Parent Hub";
      const data={title:"Orange Crush Lacrosse "+who,text:"Orange Crush Lacrosse "+who+": practices, games, field maps and directions.",url};
      if(navigator.share){ try{ await navigator.share(data); }catch(e){} }
      else { try{ await navigator.clipboard.writeText(url); toast("Link copied: paste it in a text or email"); }catch(e){ toast(url); } }
      return;
    }
    case "wave": S.wave=Number(el.dataset.w); render(); return;
    case "map": S.wave=Number(el.dataset.wave)||defaultWave(); goView("map"); render(); window.scrollTo(0,0); return;
    case "zoom": openViewer(); return;
    case "ev": openEvent(el.dataset.id); return;
    case "coachoff": S.coach=false; setPass(null); toast("Coach mode locked"); if(S.view==="coach"){ goView("home"); } render(); return;
    case "q":{
      const box=el.closest(".form"); const name=box.querySelector('.cks input').name; const g=el.dataset.g;
      box.querySelectorAll('input[name="'+name+'"]').forEach(i=>{ i.checked = g==="all" ? true : g==="none" ? false : (TEAM[i.value].prog===g || (g==="boys"&&false)); });
      return;
    }
    case "c-notice":{ const n=clone(DATA); n.notice=document.getElementById("c-notice").value.trim(); await save(n); return; }
    case "c-notice-clear":{ const n=clone(DATA); n.notice=""; await save(n); return; }
    case "c-night":{
      const ds=document.getElementById("n-date").value, teams=getChecked("n-teams"), st=document.getElementById("n-status").value, note=document.getElementById("n-note").value.trim();
      if(!ds||!teams.length){ toast("Pick a date and at least one team"); return; }
      const hits=allEvents().filter(e=>e.date===ds && e.type==="practice" && e.teams.some(t=>teams.includes(t)));
      if(!hits.length){ toast("No practices on "+fmtDate(ds)+" for those teams"); return; }
      const n=clone(DATA);
      hits.forEach(e=>{ const o=n.overrides[e.id]||{}; if(st==="on"){ delete o.status; delete o.note; } else { o.status=st; o.note=note; } if(Object.keys(o).length) n.overrides[e.id]=o; else delete n.overrides[e.id]; });
      await save(n); return;
    }
    case "c-add":{
      const g=id=>document.getElementById(id).value.trim();
      const teams=getChecked("a-teams"); const type=g("a-type");
      if(!teams.length||!g("a-date")||!g("a-start")||(!g("a-title")&&type!=="practice")){ toast("Title, team, date and start time are required"); return; }
      const allIds=TEAMS.map(t=>t.id);
      let tlist=teams;
      if(teams.length===allIds.length) tlist=["all"];
      else ["boys","girls"].forEach(p=>{ const ids=TEAMS.filter(t=>t.prog===p).map(t=>t.id); if(ids.every(i=>tlist.includes(i))) tlist=tlist.filter(i=>!ids.includes(i)).concat(p); });
      const e={id:"c-"+Date.now().toString(36),type,teams:tlist,date:g("a-date"),start:g("a-start"),stop:g("a-stop")||"",title:g("a-title")||"Extra practice",locName:g("a-loc")||LOCS.nnhs.name,addr:g("a-addr")||LOCS.nnhs.addr,zone:g("a-zone"),note:g("a-note")};
      if(!g("a-loc")&&!g("a-addr")) e.loc="nnhs";
      const n=clone(DATA); n.custom.push(e); await save(n); return;
    }
    case "e-save":{
      const id=el.dataset.id; const g=x=>document.getElementById(x).value.trim();
      const n=clone(DATA);
      if(id.startsWith("c-")){
        const c=n.custom.find(x=>x.id===id); if(!c) return;
        c.start=g("e-start")||c.start; c.stop=g("e-stop"); c.zone=g("e-zone"); c.note=g("e-note");
        if(g("e-loc")) c.locName=g("e-loc"); if(g("e-addr")) c.addr=g("e-addr");
        const st=g("e-status"); if(st==="on") delete n.overrides[id]; else n.overrides[id]={status:st};
      } else {
        const base=BASE.find(x=>x.id===id); const o={};
        const st=g("e-status"); if(st!=="on") o.status=st;
        if(g("e-note")) o.note=g("e-note");
        if(g("e-start")&&g("e-start")!==base.start) o.start=g("e-start");
        if(g("e-stop")&&g("e-stop")!==base.stop) o.stop=g("e-stop");
        if(g("e-zone")!==(base.zone||"")) o.zone=g("e-zone");
        if(base.type==="game"&&g("e-stop")&&!base.stop) o.stop=g("e-stop");
        if(g("e-loc")) o.locName=g("e-loc"); if(g("e-addr")) o.addr=g("e-addr");
        if(Object.keys(o).length) n.overrides[id]=o; else delete n.overrides[id];
      }
      await save(n,"e-msg"); return;
    }
    case "e-reset":{ const n=clone(DATA); delete n.overrides[el.dataset.id]; await save(n,"e-msg"); return; }
    case "e-del":{
      const b=el; if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Tap again to delete"; return; }
      const n=clone(DATA); n.custom=n.custom.filter(x=>x.id!==el.dataset.id); delete n.overrides[el.dataset.id]; await save(n,"e-msg"); return;
    }
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeOv(); if(e.key==="Enter" && e.target && e.target.id==="u-pass"){ const b=document.querySelector('[data-act="unlock"]'); if(b) b.click(); } });
function defaultWave(){ const w=S.sel.map(id=>TEAM[id].wave); return w.length&&w.every(x=>x===2)?2:1; }

try{ history.replaceState({v:S.view},""); }catch(e){}
render();
loadState();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadState(); });
setInterval(()=>{ if(document.visibilityState==="visible") loadState(); }, 5*60*1000);
setInterval(()=>{ if(document.visibilityState==="visible" && S.view==="home" && !ov.innerHTML) render(); }, 60*1000);
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
